services:
  - type: web
    name: acme-hrms-api
    env: docker
    repo: https://github.com/Kondapaneni/HRMS.git
    branch: main
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_GEOCODING_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://acme-hrms-frontend.onrender.com

  - type: web
    name: acme-hrms-frontend
    env: static
    repo: https://github.com/Kondapaneni/HRMS.git
    branch: main
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: ./frontend
    envVars:
      - key: VITE_API_URL
        value: https://acme-hrms-api.onrender.com/api
