<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Application Status Update</title></head>
<body style="margin:0;padding:24px;background:#f8fafd;color:#1f1f1f;font-family:Arial,sans-serif">
  <table role="presentation" style="max-width:540px;margin:auto;background:white;border:1px solid #e0e3e7;border-radius:16px" cellspacing="0" cellpadding="0" width="100%">
    <tr><td style="padding:24px 28px"><h2 style="margin:0 0 16px;color:#1a73e8">Application Update</h2>
      <p>Hello {{firstName}},</p>
      <p>Your application for <strong>{{jobTitle}}</strong> is now <strong>{{applicationStatus}}</strong>.</p>
      <p>You can review your application details by signing into the Acme HRMS candidate portal.</p>
      <p>Best regards,<br>Acme HR Team</p>
    </td></tr>
    <tr><td style="padding:16px 28px;font-size:11px;background:#f8fafd;color:#5f6368">Automated notification &copy; {{currentYear}} Acme Corp HRMS.</td></tr>
  </table>
</body>
</html>
