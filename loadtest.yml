config:
  # The base URL of your API (update if your backend runs on a different port)
  target: "http://localhost:8081"
  phases:
    - duration: 10
      arrivalRate: 5
      name: "Warm up phase"
    - duration: 30
      arrivalRate: 20
      name: "Sustained load phase"
  defaults:
    headers:
      # This secret bypasses the RateLimiter so our test doesn't get blocked
      X-Load-Test: "acme_loadtest_secret_2026"

scenarios:
  - name: "Admin Employee Browsing Flow"
    flow:
      # 1. Log in to get the HttpOnly cookie
      - post:
          url: "/api/login"
          json:
            email: "admin@example.com" # Change this to your actual admin email
            password: "password123"    # Change this to your actual admin password
          capture:
            # We just capture the response status to ensure login succeeded
            - json: "$.user.id"
              as: "userId"
          expect:
            - statusCode: 200

      # 2. Wait a split second to simulate a real user transition
      - think: 1

      # 3. Hit the employees list page (which does heavy DB joins)
      - get:
          url: "/api/admin/employees"
          expect:
            - statusCode: 200
          
      - think: 2

      # 4. Search for a specific employee
      - get:
          url: "/api/admin/employees?search=john"
          expect:
            - statusCode: 200
