; PERF-008: Immutable PHP 8.2 Apache production container.
; OPcache caches PHP bytecode only; it does not cache employee or session data.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
; Every Render deployment starts a newly built PHP container.
opcache.validate_timestamps=0
opcache.save_comments=1
opcache.jit=disable
opcache.jit_buffer_size=0
