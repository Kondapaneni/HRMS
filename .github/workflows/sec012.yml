name: SEC-012 stage 1 token revocation password and OTP hardening

on:
  pull_request:
    paths:
      - 'backend/src/Utils/SessionVersion.php'
      - 'backend/src/Utils/OtpCode.php'
      - 'backend/src/Middleware/AuthMiddleware.php'
      - 'backend/src/Middleware/MaintenanceMiddleware.php'
      - 'backend/public/index.php'
      - 'backend/public/mfa_routes.php'
      - 'backend/public/candidate_auth_routes.php'
      - 'backend/public/sec003_file_access.php'
      - 'frontend/src/contexts/AuthContext.jsx'
      - 'frontend/src/pages/ChangePassword.jsx'
      - 'tests/sec012_*'
      - '.github/workflows/sec012.yml'
  push:
    branches: ['main', 'fix/sec-012-session-revocation-password-otp-stage1']
    paths:
      - 'backend/src/Utils/SessionVersion.php'
      - 'backend/src/Utils/OtpCode.php'
      - 'backend/src/Middleware/AuthMiddleware.php'
      - 'backend/public/index.php'
      - 'tests/sec012_*'
      - '.github/workflows/sec012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-http:
    name: Synthetic PostgreSQL auth + JWT replay denials
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sec012_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: sec012_synthetic_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sec012_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: sec012_test
      DB_USERNAME: postgres
      DB_PASSWORD: sec012_synthetic_only
      JWT_SECRET: SEC012_TEST_ONLY_SECRET_NOT_FOR_PRODUCTION
      APP_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lint auth routes and source-policy tests
        shell: bash
        run: |
          set -euo pipefail
          for file in backend/src/Utils/SessionVersion.php backend/src/Utils/OtpCode.php backend/src/Middleware/AuthMiddleware.php backend/src/Middleware/MaintenanceMiddleware.php backend/public/index.php backend/public/mfa_routes.php backend/public/candidate_auth_routes.php backend/public/sec003_file_access.php tests/sec012_*.php; do
            php -l "$file"
          done
          node tests/sec012_policy_test.mjs
      - name: Install backend test dependencies
        run: composer install --working-dir=backend --no-interaction --prefer-dist --no-progress
      - name: Exercise OTP HMAC and version claim helpers
        run: php tests/sec012_helpers_test.php
      - name: Seed synthetic database and start local PHP API
        shell: bash
        run: |
          set -euo pipefail
          php tests/sec012_seed.php
          cat > backend/.env <<'SEC012_TEST_ENV'
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_DATABASE=sec012_test
          DB_USERNAME=postgres
          DB_PASSWORD=sec012_synthetic_only
          JWT_SECRET=SEC012_TEST_ONLY_SECRET_NOT_FOR_PRODUCTION
          APP_ENV=production
          SEC012_TEST_ENV
          php -S 127.0.0.1:8773 -t backend/public backend/public/index.php > /tmp/sec012-server.log 2>&1 &
          echo $! > /tmp/sec012-php.pid
          for i in {1..25}; do
            if curl --fail --silent http://127.0.0.1:8773/version.json > /dev/null; then exit 0; fi
            sleep 1
          done
          tail -n 80 /tmp/sec012-server.log
          exit 1
      - name: Replay JWT after logout/change/reset and verify OTP digest through real HTTP
        shell: bash
        run: |
          set -euo pipefail
          trap 'kill "$(cat /tmp/sec012-php.pid)" 2>/dev/null || true' EXIT
          node tests/sec012_http_test.mjs

  browser-build:
    name: Change-password UI and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Security and existing login UI regressions
        run: |
          node tests/sec012_policy_test.mjs
          node tests/sec008_frontend_security_test.mjs
          node tests/sec008_login_reset_test.mjs
      - name: Compile production frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
