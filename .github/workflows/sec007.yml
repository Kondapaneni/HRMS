name: SEC-007 security headers and CORS regression

on:
  push:
    branches: ['main', 'fix/sec-007-headers-cors']
    paths:
      - 'backend/public/.htaccess'
      - 'backend/public/index.php'
      - 'backend/public/sec007_cors.php'
      - 'docker-entrypoint.sh'
      - 'tests/sec007_cors_test.php'
      - '.github/workflows/sec007.yml'
  pull_request:
    paths:
      - 'backend/public/.htaccess'
      - 'backend/public/index.php'
      - 'backend/public/sec007_cors.php'
      - 'docker-entrypoint.sh'
      - 'tests/sec007_cors_test.php'
      - '.github/workflows/sec007.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cors-php:
    name: CORS exact-origin and live PHP route checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: PHP syntax and CORS unit tests
        run: |
          php -l backend/public/index.php
          php -l backend/public/sec007_cors.php
          php -l tests/sec007_cors_test.php
          php tests/sec007_cors_test.php
      - name: Install PHP dependencies
        run: composer install --working-dir=backend --no-interaction --prefer-dist --no-progress
      - name: Test actual Slim response CORS policy
        shell: bash
        run: |
          set -euo pipefail
          FRONTEND_URL="https://hrms-qwv3.onrender.com" CORS_ALLOWED_ORIGINS="http://localhost:5173,capacitor://localhost" \
            php -S 127.0.0.1:8767 -t backend/public backend/public/index.php > /tmp/sec007-php.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for i in {1..15}; do
            if curl --fail --silent http://127.0.0.1:8767/version.json > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then cat /tmp/sec007-php.log; exit 1; fi
          allowed=$(curl -sS -D - -o /dev/null -H 'Origin: http://localhost:5173' http://127.0.0.1:8767/version.json)
          echo "$allowed" | grep -qi '^Access-Control-Allow-Origin: http://localhost:5173'
          echo "$allowed" | grep -qi '^Access-Control-Allow-Credentials: true'
          echo "$allowed" | grep -qi '^Vary:.*Origin'
          denied=$(curl -sS -D - -o /dev/null -H 'Origin: https://attacker.example' http://127.0.0.1:8767/version.json)
          if echo "$denied" | grep -qi '^Access-Control-Allow-Origin:'; then echo "Untrusted origin reflected"; exit 1; fi
          if echo "$denied" | grep -qi '^Access-Control-Allow-Credentials:'; then echo "Credentials shared with untrusted origin"; exit 1; fi
          no_origin=$(curl -sS -D - -o /dev/null http://127.0.0.1:8767/version.json)
          if echo "$no_origin" | grep -qi '^Access-Control-Allow-Origin:'; then echo "No-Origin response incorrectly exposes CORS"; exit 1; fi
          preflight=$(curl -sS -D - -o /dev/null -X OPTIONS -H 'Origin: capacitor://localhost' \
            -H 'Access-Control-Request-Method: POST' \
            http://127.0.0.1:8767/api/employee/attendance/punch)
          echo "$preflight" | grep -qi '^Access-Control-Allow-Origin: capacitor://localhost'
          echo "SEC-007 real Slim CORS regression passed"

  apache-headers:
    name: Apache static HTML and JSON security headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start real Apache with production .htaccess
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sec007-fixture"
          cp backend/public/.htaccess "$RUNNER_TEMP/sec007-fixture/.htaccess"
          printf '<!doctype html><title>SEC-007 test</title>' > "$RUNNER_TEMP/sec007-fixture/index.html"
          printf '{"name":"HRMS"}' > "$RUNNER_TEMP/sec007-fixture/manifest.json"
          docker run --rm -d --name sec007-apache -p 127.0.0.1:8768:80 \
            -v "$RUNNER_TEMP/sec007-fixture:/var/www/html:ro" php:8.2-apache \
            bash -lc 'a2enmod rewrite headers && sed -i "s/AllowOverride None/AllowOverride All/g" /etc/apache2/apache2.conf && apache2-foreground'
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8768/ > /dev/null; then break; fi
            sleep 1
          done
          docker exec sec007-apache apache2ctl -t
      - name: Confirm static and JSON headers without wildcard CORS
        shell: bash
        run: |
          set -euo pipefail
          for path in / /manifest.json; do
            headers=$(curl --fail --silent --show-error -D - -o /dev/null "http://127.0.0.1:8768$path")
            for header in X-Content-Type-Options X-Frame-Options Referrer-Policy Permissions-Policy Strict-Transport-Security Content-Security-Policy Content-Security-Policy-Report-Only; do
              if ! echo "$headers" | grep -qi "^$header:"; then echo "Missing $header on $path"; exit 1; fi
            done
            echo "$headers" | grep -qi '^X-Content-Type-Options: nosniff'
            echo "$headers" | grep -qi '^X-Frame-Options: SAMEORIGIN'
            if echo "$headers" | grep -qi '^Access-Control-Allow-Origin:'; then echo "Static wildcard CORS still present on $path"; exit 1; fi
          done
          echo "SEC-007 Apache static HTML/JSON regression passed"
      - name: Stop test Apache
        if: always()
        run: docker rm -f sec007-apache || true
