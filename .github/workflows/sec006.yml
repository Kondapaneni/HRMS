name: SEC-006 Android native security regression
on:
  push:
    branches: ['main', 'fix/sec-006-android-security']
    paths:
      - 'frontend/android/**'
      - 'frontend/capacitor.config.json'
      - 'tests/sec006_android_security_test.mjs'
      - '.github/workflows/sec006.yml'
  pull_request:
    paths:
      - 'frontend/android/**'
      - 'frontend/capacitor.config.json'
      - 'tests/sec006_android_security_test.mjs'
      - '.github/workflows/sec006.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: SEC-006 Android security configuration regression
        run: node --test tests/sec006_android_security_test.mjs tests/android_release_delivery_test.mjs

  android-native-build:
    needs: static-security
    runs-on: ubuntu-latest
    concurrency:
      group: hrms-android-release-publish
      cancel-in-progress: false
    env:
      HRMS_ANDROID_VERSION_CODE: ${{ github.run_number }}
      HRMS_ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # GitHub's hosted Ubuntu runners already include Android SDK command-line
      # tools. Avoid setup-android@v3, which tries to install removed 'tools'.
      - name: Use preinstalled Android SDK
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Install Android SDK platform and build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Sync native Capacitor configuration
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx cap sync android
      - name: Confirm Capacitor-generated Android configuration remains HTTPS only
        run: |
          node --test tests/sec006_android_security_test.mjs
          test -f frontend/android/app/src/main/assets/capacitor.config.json
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('frontend/android/app/src/main/assets/capacitor.config.json','utf8'));if(c.server?.cleartext!==false || c.plugins?.CapacitorHttp?.enabled!==false || !c.server?.url?.startsWith('https://'))process.exit(1)"
      - name: Compile Android debug and optimized release APKs
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease
      - name: Inspect merged release manifest
        working-directory: frontend/android
        run: |
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging app/build/outputs/apk/release/app-release-unsigned.apk | head -n 8
          find app/build/outputs/mapping/release -name mapping.txt -size +0c | grep -q mapping.txt
      - name: Upload Android debug APK for device verification
        uses: actions/upload-artifact@v4
        with:
          name: hrms-sec006-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      # The ordinary CI artifact is a test build. Only a signed release goes to employees.
      - name: Publish signed Android update for Employee Profile
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.HRMS_ANDROID_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.HRMS_ANDROID_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.HRMS_ANDROID_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.HRMS_ANDROID_RELEASE_KEY_PASSWORD }}
          SUPABASE_RELEASE_KEY: ${{ secrets.HRMS_SUPABASE_RELEASE_SECRET_KEY }}
          SUPABASE_RELEASE_URL: https://jtgqkkhqyzfbupiqwkgf.supabase.co
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$RELEASE_KEYSTORE_BASE64" && -z "$RELEASE_STORE_PASSWORD" && -z "$RELEASE_KEY_ALIAS" && -z "$RELEASE_KEY_PASSWORD" && -z "$SUPABASE_RELEASE_KEY" ]]; then
            echo "::notice::No signing/publication secrets configured; APK publishing is disabled until setup is complete."
            exit 0
          fi
          if [[ -z "$RELEASE_KEYSTORE_BASE64" || -z "$RELEASE_STORE_PASSWORD" || -z "$RELEASE_KEY_ALIAS" || -z "$RELEASE_KEY_PASSWORD" || -z "$SUPABASE_RELEASE_KEY" ]]; then
            echo "::error::Android APK publishing is partially configured. Set all five HRMS release secrets."
            exit 1
          fi

          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          TEMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEMP_DIR"' EXIT
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$TEMP_DIR/release.jks"
          UNSIGNED="frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED="$TEMP_DIR/acme-hrms.apk"

          "$TOOLS/zipalign" -f 4 "$UNSIGNED" "$TEMP_DIR/aligned.apk"
          "$TOOLS/apksigner" sign \
            --ks "$TEMP_DIR/release.jks" \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass env:RELEASE_STORE_PASSWORD \
            --key-pass env:RELEASE_KEY_PASSWORD \
            --out "$SIGNED" "$TEMP_DIR/aligned.apk"
          "$TOOLS/apksigner" verify --verbose "$SIGNED"

          # Never advertise an APK as an in-place update if it has the wrong signer.
          LEGACY_APK="frontend/public/downloads/Acme HRMS.apk"
          if [[ -f "$LEGACY_APK" ]]; then
            expected_cert="$("$TOOLS/apksigner" verify --print-certs "$LEGACY_APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
            actual_cert="$("$TOOLS/apksigner" verify --print-certs "$SIGNED" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
            if [[ -z "$expected_cert" || "$expected_cert" != "$actual_cert" ]]; then
              echo "::error::Release signing certificate differs from the current public APK. Existing Android installations cannot update in place."
              exit 1
            fi
          fi

          RELEASE_PATH="android/releases/$HRMS_ANDROID_VERSION_CODE/acme-hrms.apk"
          APK_SHA256="$(sha256sum "$SIGNED" | cut -d ' ' -f 1)"
          export RELEASE_PATH APK_SHA256
          PUBLIC_BASE="$SUPABASE_RELEASE_URL/storage/v1/object/public/app_builds"

          # Avoid replacing a newer published version if an older workflow completes late.
          current_version="$(curl -fsS --max-time 15 "$PUBLIC_BASE/android/latest.json" | node -e "let x='';process.stdin.on('data',d=>x+=d).on('end',()=>{try{process.stdout.write(String(JSON.parse(x).versionCode||0))}catch{process.stdout.write('0')}})" || echo 0)"
          if [[ "$current_version" =~ ^[0-9]+$ ]] && (( current_version >= HRMS_ANDROID_VERSION_CODE )); then
            echo "::notice::A newer/equal Android APK is already published; skipping older build."
            exit 0
          fi

          # Upload immutable versioned APK first. Latest pointer changes only after success.
          curl --fail-with-body --silent --show-error --retry 3 \
            --request POST \
            --header "apikey: $SUPABASE_RELEASE_KEY" \
            --header "Authorization: Bearer $SUPABASE_RELEASE_KEY" \
            --header "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@$SIGNED" \
            "$SUPABASE_RELEASE_URL/storage/v1/object/app_builds/$RELEASE_PATH"

          node <<'NODE'
          const fs = require('node:fs');
          const base = process.env.SUPABASE_RELEASE_URL;
          fs.writeFileSync('android-release-latest.json', JSON.stringify({
            versionCode: Number(process.env.HRMS_ANDROID_VERSION_CODE),
            versionName: process.env.HRMS_ANDROID_VERSION_NAME,
            downloadUrl: base + '/storage/v1/object/public/app_builds/' + process.env.RELEASE_PATH + '?download=Acme%20HRMS.apk',
            sha256: process.env.APK_SHA256,
            publishedAt: new Date().toISOString(),
            sourceRun: 'https://github.com/' + process.env.GITHUB_REPOSITORY + '/actions/runs/' + process.env.GITHUB_RUN_ID
          }, null, 2));
          NODE

          curl --fail-with-body --silent --show-error --retry 3 \
            --request POST \
            --header "apikey: $SUPABASE_RELEASE_KEY" \
            --header "Authorization: Bearer $SUPABASE_RELEASE_KEY" \
            --header "Content-Type: application/json" \
            --header "x-upsert: true" \
            --data-binary "@android-release-latest.json" \
            "$SUPABASE_RELEASE_URL/storage/v1/object/app_builds/android/latest.json"

          echo "::notice::Signed Android APK v$HRMS_ANDROID_VERSION_NAME published to Employee Profile."
