name: SEC-006 Android native security regression
on:
  push:
    branches: ['main', 'fix/sec-006-android-security']
    paths:
      - 'frontend/android/**'
      - 'frontend/capacitor.config.json'
      - 'tests/sec006_android_security_test.mjs'
      - '.github/workflows/sec006.yml'
  pull_request:
    paths:
      - 'frontend/android/**'
      - 'frontend/capacitor.config.json'
      - 'tests/sec006_android_security_test.mjs'
      - '.github/workflows/sec006.yml'
  workflow_dispatch:
    inputs:
      allow_signer_migration:
        description: 'One-time migration ONLY: existing HRMS installs must uninstall before installing'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  static-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: SEC-006 Android security configuration regression
        run: node --test tests/sec006_android_security_test.mjs

  android-native-build:
    runs-on: ubuntu-latest
    env:
      HRMS_ANDROID_VERSION_CODE: ${{ github.run_number }}
      HRMS_ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # GitHub's hosted Ubuntu runners already include Android SDK command-line
      # tools. Avoid setup-android@v3, which tries to install removed 'tools'.
      - name: Use preinstalled Android SDK
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Install Android SDK platform and build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Sync native Capacitor configuration
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx cap sync android
      - name: Confirm Capacitor-generated Android configuration remains HTTPS only
        run: |
          node --test tests/sec006_android_security_test.mjs
          test -f frontend/android/app/src/main/assets/capacitor.config.json
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('frontend/android/app/src/main/assets/capacitor.config.json','utf8'));if(c.server?.cleartext!==false || c.plugins?.CapacitorHttp?.enabled!==false || !c.server?.url?.startsWith('https://'))process.exit(1)"
      - name: Compile Android debug and optimized release APKs
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease
      - name: Inspect merged release manifest
        working-directory: frontend/android
        run: |
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging app/build/outputs/apk/release/app-release-unsigned.apk | head -n 8
          find app/build/outputs/mapping/release -name mapping.txt -size +0c | grep -q mapping.txt

      - name: Save test APK in GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: hrms-android-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Save unsigned release APK for secure signing
        uses: actions/upload-artifact@v4
        with:
          name: hrms-android-unsigned-release
          path: frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 2

  publish-website-apk:
    name: Publish signed APK to Employee Profile (only when safe)
    needs: [static-security, android-native-build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_KEYSTORE_B64: ${{ secrets.HRMS_ANDROID_RELEASE_KEYSTORE_BASE64 }}
      RELEASE_PASSWORD: ${{ secrets.HRMS_ANDROID_RELEASE_STORE_PASSWORD }}
      # A single, explicit approval commit can initiate the first development-only migration.
      # Later pushes do not match this exact commit message, so automatic migrations remain blocked.
      ALLOW_SIGNER_MIGRATION: ${{ (github.event_name == 'workflow_dispatch' && inputs.allow_signer_migration) || (github.event_name == 'push' && github.event.head_commit.message == 'INITIAL_SIGNER_MIGRATION_APPROVED') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hrms-android-unsigned-release
          path: unsigned-release

      - name: Confirm permanent signing key configured
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_KEYSTORE_B64" && -z "$RELEASE_PASSWORD" ]]; then
            echo "::notice::No permanent signing key yet; keeping existing employee APK unchanged."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$RELEASE_KEYSTORE_B64" || -z "$RELEASE_PASSWORD" ]]; then
            echo "::error::Set BOTH release signing secrets, or neither."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Sign, validate and publish employee APK
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          temporary="$(mktemp -d)"
          trap 'rm -rf "$temporary"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 -d > "$temporary/release.p12"

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;36.0.0"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          existing="frontend/public/downloads/Acme HRMS.apk"
          unsigned="unsigned-release/app-release-unsigned.apk"
          signed="$temporary/acme-hrms.apk"

          test -s "$existing"
          test -s "$unsigned"
          "$ZIPALIGN" -f 4 "$unsigned" "$temporary/aligned.apk"
          "$APKSIGNER" sign --ks "$temporary/release.p12" \
            --ks-key-alias hrms-release \
            --ks-pass env:RELEASE_PASSWORD \
            --key-pass env:RELEASE_PASSWORD \
            --out "$signed" "$temporary/aligned.apk"
          "$APKSIGNER" verify --verbose "$signed"

          old_package="$("$AAPT" dump badging "$existing" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          new_package="$("$AAPT" dump badging "$signed" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          if [[ -z "$old_package" || "$new_package" != "$old_package" ]]; then
            echo "::error::Package identifiers differ; cannot publish update."
            exit 1
          fi

          old_version="$("$AAPT" dump badging "$existing" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n 1)"
          new_version="$("$AAPT" dump badging "$signed" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n 1)"
          if [[ -z "$old_version" || -z "$new_version" || "$new_version" -le "$old_version" ]]; then
            echo "::error::New Android versionCode must be greater than previous release."
            exit 1
          fi

          old_cert="$("$APKSIGNER" verify --print-certs "$existing" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          new_cert="$("$APKSIGNER" verify --print-certs "$signed" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          if [[ -z "$old_cert" || -z "$new_cert" ]]; then
            echo "::error::Unable to verify APK signing certificates."
            exit 1
          fi
          if [[ "$old_cert" != "$new_cert" ]]; then
            if [[ "$ALLOW_SIGNER_MIGRATION" != "true" ]]; then
              echo "::warning::Certificate mismatch. Existing employees cannot update in place. Website APK unchanged."
              echo "::notice::Only a manually approved one-time signing-key migration may replace it."
              exit 0
            fi
            echo "::warning::SIGNER MIGRATION APPROVED: existing installations will require uninstall/reinstall."
          fi

          cp "$signed" "$existing"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$existing"
          if ! git diff --cached --quiet; then
            git commit -m "build(android): publish signed APK to employee downloads [skip ci]"
            git push origin HEAD:main
          fi
