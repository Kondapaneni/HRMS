name: SEC-018 restricted role audit and transaction pooler
on:
  pull_request:
    paths: ['backend/**', 'tests/**', 'supabase/**', '.github/workflows/sec018.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-security:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 17]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: sec018_phasea_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: SEC018_PHASEA_CI_PG_ONLY
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d sec018_phasea_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: sec018_phasea_ci
      DB_USERNAME: postgres
      DB_PASSWORD: SEC018_PHASEA_CI_PG_ONLY
      PGPASSWORD: SEC018_PHASEA_CI_PG_ONLY
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql, curl
      - name: Apply review-only SQL to disposable fixture
        shell: bash
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d sec018_phasea_ci -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN BYPASSRLS;'
          psql -h 127.0.0.1 -U postgres -d sec018_phasea_ci -v ON_ERROR_STOP=1 -f tests/sec018_phasea_schema_ci.sql
          # Synthetic worker role/grants exist BEFORE the SEC-018 migration.
          # Confirm the migration preserves explicit service_role access.
          psql -h 127.0.0.1 -U postgres -d sec018_phasea_ci -v ON_ERROR_STOP=1 -c 'GRANT SELECT, INSERT, UPDATE ON TABLE public.email_queue TO service_role;'
          # Reject unsafe schema drift *before* either review-only migration.
          # Deliberate mutations are restored in this disposable CI database.
          bash tests/sec018_migration_guards_ci.sh
          for file in supabase/review-only/20261116_sec018_runtime_role_review_only.sql supabase/review-only/20261116_sec018_signed_audit_review_only.sql; do
            psql -h 127.0.0.1 -U postgres -d sec018_phasea_ci -v ON_ERROR_STOP=1 -f "$file"
          done
          php tests/sec018_phasea_acceptance_ci.php
          for mode in default restricted missing-password wrong-role missing-audit; do
            php tests/sec018_db_switch_ci.php "$mode"
          done
      - name: Install isolated transaction pooler
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y pgbouncer
          sudo systemctl stop pgbouncer
          mkdir /tmp/sec018-pool
          cat > /tmp/sec018-pool/pgbouncer.ini <<'INI'
          [databases]
          sec018_phasea_ci = host=127.0.0.1 port=5432 dbname=sec018_phasea_ci
          [pgbouncer]
          listen_addr = 127.0.0.1
          listen_port = 6432
          auth_type = plain
          auth_file = /tmp/sec018-pool/userlist.txt
          pool_mode = transaction
          default_pool_size = 1
          max_client_conn = 30
          logfile = /tmp/sec018-pool/pool.log
          pidfile = /tmp/sec018-pool/pool.pid
          INI
          echo '"hrms_runtime_restricted" "SEC018_PHASEA_CI_RUNTIME_ONLY"' > /tmp/sec018-pool/userlist.txt
          sudo chown -R postgres:postgres /tmp/sec018-pool
          sudo -u postgres pgbouncer -d /tmp/sec018-pool/pgbouncer.ini
          for i in {1..20}; do pg_isready -h 127.0.0.1 -p 6432 && break; sleep 1; done
      - name: Actual PHP classes through direct and transaction-pooled connections
        run: |
          php tests/sec018_adversarial_ci.php 5432
          php tests/sec018_adversarial_ci.php 6432
          php tests/sec018_business_ci.php
          php tests/sec018_worker_permissions_ci.php
      - name: Actual HTTP under restricted signed-audit runtime
        shell: bash
        run: |
          set -euo pipefail
          composer install --working-dir=backend --no-interaction --prefer-dist --no-progress
          cat > backend/.env <<'ENV'
          DB_HOST=127.0.0.1
          DB_PORT=6432
          DB_DATABASE=sec018_phasea_ci
          DB_USERNAME=hrms_runtime_restricted
          DB_PASSWORD=SEC018_PHASEA_CI_RUNTIME_ONLY
          JWT_SECRET=SEC018_HTTP_SYNTHETIC_ONLY_LONG_HS256_KEY_NOT_FOR_DEPLOYMENT
          SEC018_AUDIT_CONTEXT_ENABLED=true
          SEC018_AUDIT_HMAC_KEY=ac9f1c12ebd1677a7a32e1c79b4d2a808feca339589d302d1bdb102edc4b9e1a
          APP_ENV=production
          ENV
          env -u DB_HOST -u DB_PORT -u DB_DATABASE -u DB_USERNAME -u DB_PASSWORD php -S 127.0.0.1:8788 -t backend/public backend/public/index.php > /tmp/sec018-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8788/version.json >/dev/null 2>&1; then ready=1; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then tail -n 100 /tmp/sec018-http.log || true; exit 1; fi
          php tests/sec018_restricted_http_ci.php || { tail -n 100 /tmp/sec018-http.log; exit 1; }
      - name: Upload isolated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec018-pooler-evidence-${{ matrix.postgres }}
          path: |
            /tmp/sec018-pool/*.log
            /tmp/sec018-http.log

  # Step 1G-3: separate disposable DB, independent of existing security checks.
  # Test restores ONLY synthetic GitHub Actions fixture data and contains
  # destructive DROP DATABASE commands guarded by the script.
  isolated-rollback:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 17]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: sec018_phasea_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: SEC018_PHASEA_CI_PG_ONLY
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d sec018_phasea_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: sec018_phasea_ci
      DB_USERNAME: postgres
      DB_PASSWORD: SEC018_PHASEA_CI_PG_ONLY
      PGPASSWORD: SEC018_PHASEA_CI_PG_ONLY
      SEC018_PG_MAJOR: '${{ matrix.postgres }}'
    steps:
      - uses: actions/checkout@v4
      - name: Provision synthetic source schema for backup rehearsal
        shell: bash
        run: |
          set -euo pipefail
          psql -X -h 127.0.0.1 -U postgres -d sec018_phasea_ci -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN BYPASSRLS;'
          psql -X -h 127.0.0.1 -U postgres -d sec018_phasea_ci -v ON_ERROR_STOP=1 -f tests/sec018_phasea_schema_ci.sql > /dev/null
          psql -X -h 127.0.0.1 -U postgres -d sec018_phasea_ci -v ON_ERROR_STOP=1 -c 'GRANT SELECT, INSERT, UPDATE ON public.email_queue TO service_role;'
      - name: Rehearse synthetic custom backup, proposed migration and exact restoration
        shell: bash
        run: |
          set -euo pipefail
          bash tests/sec018_rollback_ci.sh

  # SEC-018 verified routine provenance in a separate disposable DB. This
  # recreates the two actual (screened, secret-free) DEV function bodies.
  # It cannot interact with connected Supabase/Render projects.
  isolated-real-functions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 17]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: sec018_phasea_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: SEC018_PHASEA_CI_PG_ONLY
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d sec018_phasea_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: sec018_phasea_ci
      DB_USERNAME: postgres
      DB_PASSWORD: SEC018_PHASEA_CI_PG_ONLY
      PGPASSWORD: SEC018_PHASEA_CI_PG_ONLY
    steps:
      - uses: actions/checkout@v4
      - name: Test screened real functions against synthetic PG and review-only SQL
        shell: bash
        run: |
          set -euo pipefail
          export GITHUB_ACTIONS=true
          psql -X -h 127.0.0.1 -U postgres -d sec018_phasea_ci -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN BYPASSRLS;'
          psql -X -h 127.0.0.1 -U postgres -d sec018_phasea_ci -v ON_ERROR_STOP=1 -f tests/sec018_phasea_schema_ci.sql > /dev/null
          psql -X -h 127.0.0.1 -U postgres -d sec018_phasea_ci -v ON_ERROR_STOP=1 -c 'GRANT SELECT, INSERT, UPDATE ON TABLE public.email_queue TO service_role;'
          psql -X -h 127.0.0.1 -U postgres -d sec018_phasea_ci -v ON_ERROR_STOP=1 -f supabase/review-only/20261116_sec018_runtime_role_review_only.sql > /dev/null
          psql -X -h 127.0.0.1 -U postgres -d sec018_phasea_ci -v ON_ERROR_STOP=1 -f supabase/review-only/20261116_sec018_signed_audit_review_only.sql > /dev/null
          psql -X -h 127.0.0.1 -U postgres -d sec018_phasea_ci -v ON_ERROR_STOP=1 -f tests/sec018_real_function_provenance_ci.sql
