name: Password reset email link regression
on:
  push:
    branches: ['main']
    paths:
      - 'backend/public/index.php'
      - 'backend/src/Templates/reset_password.html'
      - 'tests/password_reset_email_test.php'
      - '.github/workflows/password-reset-email.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reset-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: php -l backend/public/index.php
      - run: php tests/password_reset_email_test.php
