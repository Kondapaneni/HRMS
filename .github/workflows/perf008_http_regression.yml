          php tests/sec009_middleware_test.php
      - name: Real HTTP endpoint access denial tests
        shell: bash
        run: |
          set -euo pipefail
          # Backend Dotenv initialization reads only this synthetic test env.
          cat > backend/.env <<'SEC009_TEST_ENV'
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_DATABASE=sec009_test
          DB_USERNAME=postgres
          DB_PASSWORD=sec009_synthetic_only
