name: SEC-023 frontend dependency vulnerability triage

on:
  push:
    branches:
      - 'fix/sec023-npm-audit-hardening'
  pull_request:
    paths:
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'tests/sec023_*'
      - '.github/workflows/sec023.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Read-only npm advisory baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Report locked-package advisories and patched options
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > /tmp/sec023-audit.json || true
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('/tmp/sec023-audit.json','utf8'));
          console.log('SEC023_COUNTS=' + JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          for (const [name, info] of Object.entries(report.vulnerabilities ?? {})) {
            console.log('SEC023_FINDING=' + JSON.stringify({
              name, severity:info.severity, range:info.range,
              fixAvailable:info.fixAvailable,
              via:(info.via ?? []).filter(v => typeof v === 'object').map(v=>({name:v.name,range:v.range,url:v.url})),
            }));
          }
          NODE
          for name in axios react-router react-router-dom follow-redirects form-data; do
            echo "SEC023_LATEST $name $(npm view "$name" version)"
          done
