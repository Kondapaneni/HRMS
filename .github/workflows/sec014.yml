name: SEC-014 server attendance geofence and trustworthy rate limiting

on:
  push:
    branches: ['main', 'fix/sec014-server-geofence-trusted-rate-limits']
    paths:
      - 'backend/src/Security/AttendanceGeofence.php'
      - 'backend/src/Utils/RateLimiter.php'
      - 'backend/public/employee_attendance_routes.php'
      - 'backend/public/index.php'
      - 'frontend/src/pages/EmployeeMobileMap.jsx'
      - 'frontend/src/pages/EmployeeDashboard.jsx'
      - 'tests/sec014_*'
      - '.github/workflows/sec014.yml'
  pull_request:
    paths:
      - 'backend/src/Security/AttendanceGeofence.php'
      - 'backend/src/Utils/RateLimiter.php'
      - 'backend/public/employee_attendance_routes.php'
      - 'backend/public/index.php'
      - 'frontend/src/pages/EmployeeMobileMap.jsx'
      - 'frontend/src/pages/EmployeeDashboard.jsx'
      - 'tests/sec014_*'
      - '.github/workflows/sec014.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-postgres-and-http:
    name: Isolated Haversine, XFF-abuse and real attendance HTTP + DB postconditions
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sec014_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: sec014_synthetic_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sec014_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: sec014_test
      DB_USERNAME: postgres
      DB_PASSWORD: sec014_synthetic_only
      JWT_SECRET: SEC014_TEST_ONLY_NOT_FOR_DEPLOYMENT
      APP_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Syntax tests
        run: |
          set -euo pipefail
          for file in backend/src/Security/AttendanceGeofence.php backend/src/Utils/RateLimiter.php backend/public/employee_attendance_routes.php backend/public/index.php tests/sec014_seed.php tests/sec014_policy_test.php tests/sec014_assert.php; do
            php -l "$file"
          done
          node --check tests/sec014_http_test.mjs
      - name: Seed isolated DB and exercise direct policy
        run: |
          composer install --working-dir=backend --no-interaction --prefer-dist --no-progress
          php tests/sec014_seed.php
          php tests/sec014_policy_test.php
      - name: Run authenticated attendance and rate-limiter real HTTP tests
        shell: bash
        run: |
          set -euo pipefail
          cat > backend/.env <<'SEC014_TEST_ENV'
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_DATABASE=sec014_test
          DB_USERNAME=postgres
          DB_PASSWORD=sec014_synthetic_only
          JWT_SECRET=SEC014_TEST_ONLY_NOT_FOR_DEPLOYMENT
          APP_ENV=production
          SEC014_TEST_ENV
          php -S 127.0.0.1:8775 -t backend/public backend/public/index.php >/tmp/sec014-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for i in {1..25}; do
            if curl --fail --silent http://127.0.0.1:8775/version.json >/dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            tail -n 100 /tmp/sec014-server.log
            exit 1
          fi
          node tests/sec014_http_test.mjs || {
            tail -n 150 /tmp/sec014-server.log
            exit 1
          }
          php tests/sec014_assert.php

  frontend:
    name: Frontend production Vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Compile frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
