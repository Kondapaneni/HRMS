name: PERF-008 live public HTTP latency baseline (read-only)
on:
  pull_request:
    paths:
      - '.github/workflows/perf008_live_public_latency.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: perf008-public-latency-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-http-timing:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Measure external HTTPS p50/p95 of public read-only endpoints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import math
          import statistics
          import time
          from urllib.request import Request, urlopen

          # No auth tokens, cookies, environment secrets, private routes,
          # test-user sessions, or Storage contents are accessed.
          BASE = "https://hrms-qwv3.onrender.com"
          ENDPOINTS = [
              ("version-json", "/version.json"),
              ("public-news", "/api/news"),
          ]
          WARMUPS = 2
          SAMPLES = 25
          PAUSE_SECONDS = 0.65

          def percentile(values, proportion):
              ordered = sorted(values)
              return ordered[max(0, math.ceil(len(ordered) * proportion) - 1)]

          def probe(path, serial):
              # Bypass edge caching without affecting HRMS application state.
              suffix = f"?perf008_readonly_latency={serial}"
              url = BASE + path + suffix
              request = Request(url, headers={
                  "User-Agent": "HRMS-PERF008-ReadOnly-Benchmark/1.0",
                  "Accept": "application/json",
                  "Cache-Control": "no-cache, no-store",
              }, method="GET")
              start = time.perf_counter()
              with urlopen(request, timeout=40) as response:
                  first_headers = time.perf_counter()
                  if response.status != 200:
                      raise RuntimeError("Unexpected public endpoint HTTP status")
                  data = response.read(1_000_001)
                  if len(data) > 1_000_000:
                      raise RuntimeError("Unexpectedly large public endpoint payload")
                  total = time.perf_counter()
              return ((first_headers - start) * 1000, (total - start) * 1000)

          print("Scope: public GET endpoints only, external GitHub-hosted runner -> Singapore Render.")
          print("TTFB approximation: elapsed time to response headers; total includes response body.")
          print("Excludes browser rendering/authenticated dashboard flow; not a Mumbai baseline.")
          print("Measurement count per endpoint:", SAMPLES, "plus", WARMUPS, "warmups")
          for name, path in ENDPOINTS:
              for i in range(WARMUPS):
                  probe(path, f"{name}-warmup-{time.time_ns()}-{i}")
                  time.sleep(PAUSE_SECONDS)
              ttfb, elapsed = [], []
              for i in range(SAMPLES):
                  first, full = probe(path, f"{name}-sample-{time.time_ns()}-{i}")
                  ttfb.append(first)
                  elapsed.append(full)
                  time.sleep(PAUSE_SECONDS)
              print(
                  f"PASS {name}: status=200 count={SAMPLES}"
                  f" ttfb_p50_ms={percentile(ttfb, 0.5):.1f}"
                  f" ttfb_p95_ms={percentile(ttfb, 0.95):.1f}"
                  f" total_p50_ms={percentile(elapsed, 0.5):.1f}"
                  f" total_p95_ms={percentile(elapsed, 0.95):.1f}"
                  f" total_min_ms={min(elapsed):.1f}"
                  f" total_max_ms={max(elapsed):.1f}"
              )
          print("All public HTTP probes succeeded. No private requests or state changes.")
          PY
