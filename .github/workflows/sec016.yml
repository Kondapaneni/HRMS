name: SEC-016 Maps browser and server key isolation

on:
  push:
    branches: ['main', 'fix/sec016-separate-google-maps-browser-key']
    paths:
      - 'backend/public/employee_attendance_routes.php'
      - 'backend/public/admin_attendance_routes.php'
      - 'frontend/src/pages/EmployeeMobileMap.jsx'
      - 'frontend/src/pages/AdminAttendanceLocation.jsx'
      - 'docker-entrypoint.sh'
      - 'render.yaml'
      - 'tests/sec016_*'
      - '.github/workflows/sec016.yml'
  pull_request:
    paths:
      - 'backend/public/employee_attendance_routes.php'
      - 'backend/public/admin_attendance_routes.php'
      - 'frontend/src/pages/EmployeeMobileMap.jsx'
      - 'frontend/src/pages/AdminAttendanceLocation.jsx'
      - 'docker-entrypoint.sh'
      - 'render.yaml'
      - 'tests/sec016_*'
      - '.github/workflows/sec016.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-boundary-and-http:
    name: Policy, isolated PostgreSQL and real employee HTTP
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sec014_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: sec014_synthetic_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sec014_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: sec014_test
      DB_USERNAME: postgres
      DB_PASSWORD: sec014_synthetic_only
      JWT_SECRET: SEC014_TEST_ONLY_NOT_FOR_DEPLOYMENT
      GOOGLE_MAPS_JS_BROWSER_KEY: SEC016_PUBLIC_BROWSER_TEST_ONLY
      GOOGLE_GEOCODING_API_KEY: SEC016_PRIVATE_GEOCODING_TEST_ONLY
      GOOGLE_MAPS_API_KEY: SEC016_LEGACY_SERVER_TEST_ONLY
      APP_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP, JS and secret boundary assertions
        run: |
          set -euo pipefail
          php -l backend/public/employee_attendance_routes.php
          php -l backend/public/admin_attendance_routes.php
          php -l tests/sec016_policy_test.php
          node --check tests/sec016_http_test.mjs
          php tests/sec016_policy_test.php
      - name: Isolated HTTP response with fake keys and synthetic employees
        run: |
          set -euo pipefail
          composer install --working-dir=backend --no-interaction --prefer-dist --no-progress
          php tests/sec014_seed.php
          cat > backend/.env <<'SEC016_FAKE_ENV'
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_DATABASE=sec014_test
          DB_USERNAME=postgres
          DB_PASSWORD=sec014_synthetic_only
          JWT_SECRET=SEC014_TEST_ONLY_NOT_FOR_DEPLOYMENT
          GOOGLE_MAPS_JS_BROWSER_KEY=SEC016_PUBLIC_BROWSER_TEST_ONLY
          GOOGLE_GEOCODING_API_KEY=SEC016_PRIVATE_GEOCODING_TEST_ONLY
          GOOGLE_MAPS_API_KEY=SEC016_LEGACY_SERVER_TEST_ONLY
          APP_ENV=production
          SEC016_FAKE_ENV
          php -S 127.0.0.1:8776 -t backend/public backend/public/index.php >/tmp/sec016-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for i in {1..25}; do
            if curl --silent --fail http://127.0.0.1:8776/version.json >/dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            tail -n 100 /tmp/sec016-server.log
            exit 1
          fi
          node tests/sec016_http_test.mjs || { tail -n 100 /tmp/sec016-server.log; exit 1; }

  frontend:
    name: Vite production build without server keys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Production compile
        working-directory: frontend
        run: |
          npm ci
          npm run build
