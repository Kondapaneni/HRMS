name: Assessment India business date at midnight

on:
  push:
    branches: ['main', 'fix/assessment-date-india-midnight']
    paths:
      - 'frontend/src/utils/assessmentBusinessDate.js'
      - 'frontend/src/hooks/useAssessmentBusinessDate.js'
      - 'frontend/src/pages/EmployeeAssessments.jsx'
      - 'frontend/src/components/EmployeeLayout.jsx'
      - 'tests/assessment_day_timezone.test.mjs'
      - '.github/workflows/assessment-date.yml'
  pull_request:
    paths:
      - 'frontend/src/utils/assessmentBusinessDate.js'
      - 'frontend/src/hooks/useAssessmentBusinessDate.js'
      - 'frontend/src/pages/EmployeeAssessments.jsx'
      - 'frontend/src/components/EmployeeLayout.jsx'
      - 'tests/assessment_day_timezone.test.mjs'
      - '.github/workflows/assessment-date.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timezone-and-build:
    name: IST midnight regressions and production frontend compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: IST midnight, browser timezones, refresh and backend alignment
        run: node tests/assessment_day_timezone.test.mjs
      - name: Frontend production build
        working-directory: frontend
        run: |
          npm ci
          npm run build
