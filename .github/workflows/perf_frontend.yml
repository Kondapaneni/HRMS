name: Frontend performance and secure navigation regression
on:
  pull_request:
    paths:
      - 'frontend/src/**'
      - 'frontend/vite.config.js'
      - 'frontend/index.html'
      - 'frontend/public/**'
      - 'backend/public/.htaccess'
      - 'backend/public/index.php'
      - 'tests/layer2_http_cache_policy_test.mjs'
      - 'tests/perf_frontend_policy_test.mjs'
      - 'tests/layer1_full_coverage_test.mjs'
      - 'tests/perf_navigation_spinner_policy_test.mjs'
      - 'tests/unified_full_page_skeleton_policy_test.mjs'
      - 'tests/mobile_orientation_navigation_test.mjs'
      - 'tests/loan_origination_directories_contract_test.mjs'
      - 'tests/perf_cold_route_policy_test.mjs'
      - 'tests/perf_refresh_boot_policy_test.mjs'
      - '.github/workflows/perf_frontend.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend-performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate frontend query, auth, route policies and SEC-021
        run: |
          node tests/perf_frontend_policy_test.mjs
          node tests/layer2_http_cache_policy_test.mjs
          node tests/perf_navigation_spinner_policy_test.mjs
          node tests/unified_full_page_skeleton_policy_test.mjs
          node --test tests/mobile_orientation_navigation_test.mjs
          node tests/layer1_full_coverage_test.mjs
          node --test tests/loan_origination_directories_contract_test.mjs
          node tests/perf_cold_route_policy_test.mjs
          node tests/perf_refresh_boot_policy_test.mjs
          node tests/sec021_policy_test.mjs
          node tests/sec012_policy_test.mjs
          node tests/sec008_frontend_security_test.mjs
          node tests/sec020_policy_test.mjs
      - name: Build production frontend and verify chunking
        working-directory: frontend
        run: |
          npm ci
          npm run build -- --manifest
      - name: PERF-001 manifest bundle and branding budgets
        run: node tests/perf001_bundle_budget.mjs --enforce
      - name: Verify production assets and SEC-021 safeguards
        run: |
          node tests/perf_frontend_policy_test.mjs --built
          node tests/unified_full_page_skeleton_policy_test.mjs
          node --test tests/mobile_orientation_navigation_test.mjs
          node tests/layer2_http_cache_policy_test.mjs --built
          node tests/perf_cold_route_policy_test.mjs --built
          node tests/perf_refresh_boot_policy_test.mjs --built
          node tests/sec021_policy_test.mjs --built
          node tests/sec020_policy_test.mjs --built
