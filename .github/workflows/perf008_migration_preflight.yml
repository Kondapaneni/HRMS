name: PERF-008 Singapore migration preflight (no live DB access)
on:
  pull_request:
    paths:
      - 'scripts/perf008_encrypted_mumbai_snapshot.sh'
      - 'scripts/perf008_verify_storage_binary.py'
      - 'tests/perf008_storage_verifier_test.py'
      - '.github/workflows/perf008_migration_preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bash syntax and no accidental CLI database access
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/perf008_encrypted_mumbai_snapshot.sh
          script=scripts/perf008_encrypted_mumbai_snapshot.sh
          grep -Fq 'Refuse real database backup in CI' "$script"
          grep -Fq 'Use a private PGPASSFILE' "$script"
          grep -Fq 'pg_dump -Fc --no-owner --no-acl' "$script"
          grep -Fq 'gpg --no-symkey-cache --symmetric --cipher-algo AES256' "$script"
          grep -Fq 'NOT a full Supabase migration' "$script"
          echo 'PERF-008 offline backup-script safety guards PASS'
      - name: Verify Storage checksum helper is syntactically valid without credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/perf008_verify_storage_binary.py
          python3 scripts/perf008_verify_storage_binary.py --help >/dev/null
          python3 tests/perf008_storage_verifier_test.py
          ! grep -Eq '\\.upload\\(|\\.remove\\(' scripts/perf008_verify_storage_binary.py
          grep -Fq 'GITHUB_ACTIONS' scripts/perf008_verify_storage_binary.py
          echo 'PERF-008 offline Storage verifier checks PASS'
