name: SEC-017 Storage path hardening
on:
  pull_request:
    paths:
      - 'backend/public/storage_routes.php'
      - 'frontend/src/**'
      - 'tests/sec001_storage_test.php'
      - 'tests/sec017_*'
      - '.github/workflows/sec017.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: fileinfo, curl, pdo_pgsql
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax and CSPRNG / MIME / ownership regression
        run: |
          php -l backend/public/storage_routes.php
          php -l tests/sec001_storage_test.php
          php tests/sec001_storage_test.php
      - name: Browser Storage adapter and returned-path source checks
        run: |
          node --check tests/sec017_storage_source_test.mjs
          node --check tests/sec017_storage_http_test.mjs
          node tests/sec017_storage_source_test.mjs


  synthetic-upload-http:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sec014_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: sec014_synthetic_only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d sec014_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: sec014_test
      DB_USERNAME: postgres
      DB_PASSWORD: sec014_synthetic_only
      JWT_SECRET: SEC014_TEST_ONLY_NOT_FOR_DEPLOYMENT
      SUPABASE_SECRET_KEY: ''
      SUPABASE_URL: ''
      APP_ENV: production
      DB_PDO_PREPARE_MODE: native
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, fileinfo, pdo_pgsql
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated PHP API dependencies and seed synthetic accounts
        run: |
          composer install --working-dir=backend --no-interaction --prefer-dist --no-progress
          php tests/sec014_seed.php
          php tests/sec016_role_seed.php
      - name: Verify unauthenticated and invalid uploads against synthetic HTTP API
        run: |
          cat > backend/.env <<'SEC017_TEST_ENV'
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_DATABASE=sec014_test
          DB_USERNAME=postgres
          DB_PASSWORD=sec014_synthetic_only
          JWT_SECRET=SEC014_TEST_ONLY_NOT_FOR_DEPLOYMENT
          APP_ENV=production
          SEC017_TEST_ENV
          php -S 127.0.0.1:8775 -t backend/public backend/public/index.php >/tmp/sec017-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for i in {1..25}; do
            if curl --fail --silent http://127.0.0.1:8775/version.json >/dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then tail -n 120 /tmp/sec017-server.log; exit 1; fi
          node tests/sec017_storage_http_test.mjs || { tail -n 120 /tmp/sec017-server.log; exit 1; }

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build production frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
