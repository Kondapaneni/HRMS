name: Secure memory-only branch cache and fresh request regression
on:
  pull_request:
    paths:
      - 'frontend/src/**'
      - 'frontend/index.html'
      - 'frontend/public/**'
      - 'backend/public/.htaccess'
      - 'backend/public/index.php'
      - 'tests/layer2_http_cache_policy_test.mjs'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'tests/no_shared_cache_policy_test.mjs'
      - 'tests/layer1_full_coverage_test.mjs'
      - 'tests/perf_navigation_spinner_policy_test.mjs'
      - 'tests/branch_cache_pilot_runtime_test.mjs'
      - 'tests/branch_cache_pilot_mounted_browser_test.mjs'
      - 'tests/mounted_remote_requests_test.mjs'
      - '.github/workflows/no_shared_cache.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-shared-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Enforce narrowly scoped memory-only branch cache and no persistence
        run: node tests/no_shared_cache_policy_test.mjs
      - name: Verify auth, maintenance and frontend navigation protections
        run: |
          node tests/sec021_policy_test.mjs
          node tests/layer2_http_cache_policy_test.mjs
          node tests/sec008_frontend_security_test.mjs
          node tests/sec020_policy_test.mjs
          node tests/perf_cold_route_policy_test.mjs
          node tests/perf_frontend_policy_test.mjs
          node tests/perf_navigation_spinner_policy_test.mjs
          node tests/layer1_full_coverage_test.mjs
          node tests/perf_refresh_boot_policy_test.mjs
          node --test tests/splash_employee_id_ui.test.mjs
      - name: Build frontend from clean, audited lockfile
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Run isolated memory-cache cancellation and identity tests
        working-directory: frontend
        timeout-minutes: 2
        run: timeout 60s node --test ../tests/branch_cache_pilot_runtime_test.mjs
      - name: Install isolated browser test support
        working-directory: frontend
        timeout-minutes: 3
        run: npm install --no-save --package-lock=false --no-audit --no-fund jsdom@26.1.0
      - name: Run real branch hook in synthetic browser with mocked authentication
        working-directory: frontend
        timeout-minutes: 2
        run: timeout 60s node --test ../tests/branch_cache_pilot_mounted_browser_test.mjs
      - name: Run existing mounted-view and auth-reset lifecycle tests
        working-directory: frontend
        timeout-minutes: 2
        run: timeout 60s node ../tests/mounted_remote_requests_test.mjs
      - name: Recheck client protections in generated bundle
        run: |
          node tests/no_shared_cache_policy_test.mjs
          node tests/sec021_policy_test.mjs --built
          node tests/layer2_http_cache_policy_test.mjs --built
          node tests/perf_frontend_policy_test.mjs --built
